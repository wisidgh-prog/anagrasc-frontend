<mat-toolbar class="ana-toolbar">

  <!-- Logo -->
  <a routerLink="src/app/Images/LOGO ANAGRASC.png" class="logo-link">
    <span class="logo-name">ANAGRASC</span>
    <span class="logo-sub">Enchères judiciaires</span>
  </a>

  <span class="spacer"></span>

  <!-- Liens publics : visibles uniquement pour les visiteurs et les enchérisseurs -->
   
  <ng-container *ngIf="!estConnecte || role === 'encherisseur'">
     <button mat-button routerLink="/acceuil" routerLinkActive="active">
       Accueil
    </button>
    <button mat-button routerLink="/catalogue" routerLinkActive="active">
      <mat-icon>gavel</mat-icon> Enchères
    </button>
    <button mat-button routerLink="/ventes-passees" routerLinkActive="active">
      Historique
    </button>
    <button mat-button routerLink="/conditions" routerLinkActive="active">
      Conditions
    </button>
  </ng-container>

  <!-- Liens enchérisseur (uniquement si connecté en tant qu'enchérisseur) -->
  <ng-container *ngIf="role === 'encherisseur'">
    <button mat-button routerLink="/mon-espace" routerLinkActive="active">
      <mat-icon>person</mat-icon> Mon espace
    </button>
    <button mat-button routerLink="/mon-espace/wallet" routerLinkActive="active">
      <mat-icon>account_balance_wallet</mat-icon> Mon portefeuille
    </button>
  </ng-container>

  <!-- Boutons droite -->
  <ng-container *ngIf="estConnecte; else nonConnecte">
    <!-- Menu utilisateur (pour tous les rôles connectés) -->
    <button mat-button [matMenuTriggerFor]="userMenu">
      <mat-icon>account_circle</mat-icon>
      {{ utilisateur?.nom_complet }}
      <mat-icon>arrow_drop_down</mat-icon>
    </button>
    <mat-menu #userMenu="matMenu">
      <button mat-menu-item (click)="deconnecter()">
        <mat-icon>logout</mat-icon> Déconnexion
      </button>
    </mat-menu>
  </ng-container>

  <ng-template #nonConnecte>
    <button mat-button routerLink="/connexion">Connexion</button>
    <button mat-raised-button class="ana-btn-accent" routerLink="/inscription">
      S'inscrire
    </button>
  </ng-template>

</mat-toolbar>
