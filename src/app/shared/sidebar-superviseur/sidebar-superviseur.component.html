<div class="sidebar">

  <div class="sidebar-profile">
    <div class="profile-avatar">SV</div>
    <div>
      <div class="profile-name">Superviseur</div>
      <div class="profile-role">ANAGRASC</div>
    </div>
  </div>

  <div class="sidebar-section">Principal</div>
  <a mat-button class="sidebar-link"
     [class.active]="estActif('/superviseur') && !estActif('/superviseur/session')"
     routerLink="/superviseur">
    <mat-icon>grid_view</mat-icon> Vue d'ensemble
  </a>

  <div class="sidebar-section">Enchères</div>
  <a mat-button class="sidebar-link"
     [class.active]="estActif('/superviseur') || estActif('/superviseur/session')"
     routerLink="/superviseur">
    <mat-icon>sensors</mat-icon> Mes sessions
  </a>

  <div class="sidebar-footer">
    <button mat-button color="warn" (click)="deconnecter()">
      <mat-icon>logout</mat-icon> Déconnexion
    </button>
  </div>
</div>
