<div class="page-container">
  <h2 class="page-title">Configuration système</h2>
  <p class="text-muted small mb-4">
    Ces paramètres s'appliquent à toutes les nouvelles sessions. Les sessions en cours ne sont pas affectées.
  </p>

  <div *ngIf="chargement" class="center-spinner">
    <mat-spinner diameter="48" color="primary"></mat-spinner>
  </div>

  <div *ngIf="!chargement" class="config-grid">
    <mat-card *ngFor="let config of configurations" class="config-card">
      <mat-card-header>
        <mat-card-title>{{ libelleConfig(config.cle) }}</mat-card-title>
      </mat-card-header>
      <mat-card-content>
        <p class="text-muted small mb-2">{{ config.description }}</p>

        <div *ngIf="messages[config.id]" class="alert alert-success py-1 small">{{ messages[config.id] }}</div>
        <div *ngIf="erreurs[config.id]" class="alert alert-danger py-1 small">{{ erreurs[config.id] }}</div>

        <mat-form-field appearance="outline" class="w-full">
          <mat-label>Valeur</mat-label>
          <input matInput [(ngModel)]="config.valeur" [placeholder]="config.description">
        </mat-form-field>
      </mat-card-content>
      <mat-card-actions align="end">
        <button mat-raised-button color="primary" (click)="modifier(config)">Enregistrer</button>
      </mat-card-actions>
    </mat-card>
  </div>
</div>
