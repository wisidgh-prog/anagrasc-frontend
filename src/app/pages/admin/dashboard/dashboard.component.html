<div class="p-4">
  <div class="page-header">
    <div>
      <h4 class="fw-bold" style="color:var(--primary);">Tableau de bord</h4>
      <small class="text-muted">Administration ANAGRASC</small>
    </div>
    <div class="d-flex gap-2">
      <button mat-stroked-button>Exporter PDF</button>
      <button mat-stroked-button>Exporter Excel</button>
    </div>
  </div>

  <div *ngIf="chargement" class="center-spinner">
    <mat-spinner diameter="48" color="primary"></mat-spinner>
  </div>

  <div *ngIf="!chargement && stats">
    <div class="stats-grid">
      <mat-card *ngFor="let m of metrics" class="stat-card">
        <mat-card-content>
          <div class="stat-label">{{ m.label }}</div>
          <div class="stat-value" [style.color]="m.color">{{ m.value }}</div>
        </mat-card-content>
      </mat-card>
    </div>

    <div class="actions-rapides">
      <a mat-raised-button color="warn" routerLink="/admin/utilisateurs">
        Comptes en attente ({{ stats.comptes_en_attente }})
      </a>
      <a mat-stroked-button routerLink="/admin/logs">Voir les logs</a>
      <a mat-stroked-button routerLink="/admin/configuration">Configuration</a>
    </div>

    <mat-card>
      <mat-card-header><mat-card-title>Dernières sessions</mat-card-title></mat-card-header>
      <mat-card-content class="p-0">
        <table mat-table [dataSource]="stats.dernieres_sessions" class="w-full">
          <ng-container matColumnDef="bien"><th mat-header-cell *matHeaderCellDef>Bien</th><td mat-cell *matCellDef="let s">{{ s.bien?.titre }}</td></ng-container>
          <ng-container matColumnDef="statut"><th mat-header-cell *matHeaderCellDef>Statut</th><td mat-cell *matCellDef="let s"><span class="ana-badge" [class.ana-badge--live]="s.statut==='en_cours'" [class.ana-badge--soon]="s.statut==='a_venir'" [class.ana-badge--done]="s.statut==='terminee'">{{ s.statut }}</span></td></ng-container>
          <ng-container matColumnDef="date"><th mat-header-cell *matHeaderCellDef>Date</th><td mat-cell *matCellDef="let s">{{ s.created_at | date:'dd/MM/yyyy' }}</td></ng-container>
          <tr mat-header-row *matHeaderRowDef="['bien','statut','date']"></tr>
          <tr mat-row *matRowDef="let row; columns: ['bien','statut','date'];"></tr>
        </table>
      </mat-card-content>
    </mat-card>
  </div>
</div>
