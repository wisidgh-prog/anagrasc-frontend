<div class="page-container">
  <div class="page-header">
    <h2>Logs et traçabilité</h2>
    <div class="d-flex gap-2">
      <button mat-stroked-button>Exporter PDF</button>
      <button mat-stroked-button>Exporter Excel</button>
    </div>
  </div>

  <!-- Filtres -->
  <mat-card class="filtres-card">
    <mat-card-content>
      <div class="filtres-row">
        <mat-form-field appearance="outline">
          <mat-label>Type d'action</mat-label>
          <mat-select [(ngModel)]="filtres.action" (selectionChange)="appliquerFiltres()">
            <mat-option *ngFor="let a of actions" [value]="a.val">{{ a.lib }}</mat-option>
          </mat-select>
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>Date début</mat-label>
          <input matInput [matDatepicker]="dpDebut" [(ngModel)]="filtres.date_debut" (dateChange)="appliquerFiltres()">
          <mat-datepicker-toggle matSuffix [for]="dpDebut"></mat-datepicker-toggle>
          <mat-datepicker #dpDebut></mat-datepicker>
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>Date fin</mat-label>
          <input matInput [matDatepicker]="dpFin" [(ngModel)]="filtres.date_fin" (dateChange)="appliquerFiltres()">
          <mat-datepicker-toggle matSuffix [for]="dpFin"></mat-datepicker-toggle>
          <mat-datepicker #dpFin></mat-datepicker>
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>Recherche description</mat-label>
          <input matInput [(ngModel)]="filtres.search" placeholder="Mot clé..." (input)="appliquerFiltres()">
        </mat-form-field>

        <button mat-stroked-button (click)="reinitialiser()">Réinitialiser</button>
      </div>
    </mat-card-content>
  </mat-card>

  <!-- Chargement -->
  <div *ngIf="chargement" class="center-spinner">
    <mat-spinner diameter="48" color="primary"></mat-spinner>
  </div>

  <!-- Tableau -->
  <mat-card *ngIf="!chargement" class="table-card">
    <mat-card-content class="p-0">
      <table mat-table [dataSource]="logs" class="w-full">
        <ng-container matColumnDef="horodatage">
          <th mat-header-cell *matHeaderCellDef>Horodatage</th>
          <td mat-cell *matCellDef="let log" class="muted" style="white-space:nowrap;">
            {{ log.horodatage | date:'dd/MM/yyyy HH:mm:ss' }}
          </td>
        </ng-container>

        <ng-container matColumnDef="action">
          <th mat-header-cell *matHeaderCellDef>Action</th>
          <td mat-cell *matCellDef="let log">
            <span class="badge" [ngClass]="couleurAction(log.action)">{{ log.action }}</span>
          </td>
        </ng-container>

        <ng-container matColumnDef="utilisateur">
          <th mat-header-cell *matHeaderCellDef>Utilisateur</th>
          <td mat-cell *matCellDef="let log">
            <span *ngIf="log.user">{{ log.user.prenom }} {{ log.user.nom }}</span>
            <span *ngIf="!log.user" class="muted">Système</span>
          </td>
        </ng-container>

        <ng-container matColumnDef="description">
          <th mat-header-cell *matHeaderCellDef>Description</th>
          <td mat-cell *matCellDef="let log">{{ log.description }}</td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="['horodatage','action','utilisateur','description']"></tr>
        <tr mat-row *matRowDef="let row; columns: ['horodatage','action','utilisateur','description'];"></tr>
      </table>

      <div *ngIf="logs.length === 0" class="empty">Aucun log pour ces filtres.</div>
    </mat-card-content>
  </mat-card>

  <!-- Pagination -->
  <div *ngIf="meta && meta.last_page > 1" class="pagination-wrapper">
    <mat-paginator
      [length]="meta.total"
      [pageSize]="15"
      [pageIndex]="meta.current_page - 1"
      (page)="changerPage($event.pageIndex + 1)">
    </mat-paginator>
  </div>
</div>
